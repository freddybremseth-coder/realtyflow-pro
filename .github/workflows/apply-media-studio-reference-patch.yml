name: Apply Media Studio integration patch

on:
  push:
    branches:
      - feature/media-reference-project-workflows
    paths:
      - scripts/apply-media-studio-reference-patch.mjs
      - .github/workflows/apply-media-studio-reference-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/media-reference-project-workflows
          fetch-depth: 0

      - name: Apply targeted source patch
        run: node scripts/apply-media-studio-reference-patch.mjs

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/media-studio/media-studio-client.tsx
          git commit -m "feat(media): integrate reference uploads and project manager"
          git push origin HEAD:feature/media-reference-project-workflows
