      - "src/lib/publishing/book-os-publication-assets-bucket-migration-contract.test.ts"
      - "supabase/migrations/20260901113000_book_os_publication_package_ingest.sql"
      - "supabase/migrations/20260901124500_book_os_publication_assets_bucket.sql"
      - ".github/workflows/book-os-publication-package-ingest.yml"
  push:
    branches:
      - "feat/book-os-publication-package-ingest"
      - "feat/book-os-artifact-upload"
      - "feat/book-os-package-expander"
      - "feat/book-os-package-quickstart"
      - "feat/book-os-series-batch-import"
      - "feat/book-os-production-handoff-builder"
      - "feat/book-os-print-production-builder"
      - "feat/book-os-print-runtime-smoke"
      - "feat/book-os-production-handoff-ui-sync"
      - "feat/book-os-production-handoff-preflight"
      - "feat/book-os-handoff-candidate-banner"
      - "feat/book-os-quality-center-deeplink"
      - "feat/book-os-launch-factory-deeplink"
      - "feat/book-os-distribution-deeplink"
    paths:
      - "src/app/api/book-growth/package-ingest/**"
      - "src/app/api/book-growth/distribution/focus/**"
      - "src/app/api/publishing/book-engine/production-handoff/**"
      - "src/app/(content)/book-growth/layout.tsx"
      - "src/app/(content)/book-growth/production-handoff/**"
      - "src/app/(content)/book-growth/package-ingest/**"
      - "src/app/(content)/book-growth/quality-center/**"
      - "src/app/(content)/book-growth/launch-factory/**"
      - "src/app/(content)/book-growth/distribution/**"
      - "src/components/book-growth/quality-center-focus-context.tsx"
      - "src/components/book-growth/launch-factory-focus-context.tsx"
      - "src/components/book-growth/distribution-focus-context.tsx"
      - "src/components/publishing/publication-artifact-uploader.tsx"
      - "src/components/publishing/publication-package-quickstart.tsx"
      - "src/components/publishing/publication-series-batch-uploader.tsx"
      - "src/components/publishing/production-handoff-candidate-banner.tsx"
      - "src/components/publishing/production-handoff-preflight-card.tsx"
      - "src/lib/publishing/publication-package*"
      - "src/lib/publishing/publication-artifact-upload*"
      - "src/lib/publishing/publication-artifact-package-expander*"
      - "src/lib/publishing/publication-ingest-draft*"
      - "src/lib/publishing/publication-series-batch*"
      - "src/lib/publishing/book-production-handoff*"
      - "src/lib/publishing/book-print-production*"
      - "src/lib/publishing/book-project-docx-export*"
      - "src/lib/publishing/book-os-quality-center-link*"
      - "src/lib/publishing/book-os-launch-factory-link*"
      - "src/lib/publishing/book-os-distribution-link*"
      - "src/services/publishing/book-print-renderer*"
      - "src/lib/publishing/book-os-publication-package-ingest-migration-contract.test.ts"
      - "src/lib/publishing/book-os-publication-assets-bucket-migration-contract.test.ts"
      - "supabase/migrations/20260901113000_book_os_publication_package_ingest.sql"
      - "supabase/migrations/20260901124500_book_os_publication_assets_bucket.sql"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publication package contracts
        run: >-
          npx tsx --test
          src/lib/publishing/publication-package.test.ts
          src/lib/publishing/publication-artifact-upload.test.ts
          src/lib/publishing/publication-artifact-package-expander.test.ts
          src/lib/publishing/publication-ingest-draft.test.ts
          src/lib/publishing/publication-series-batch.test.ts
          src/lib/publishing/book-production-handoff.test.ts
          src/lib/publishing/book-production-handoff-preflight.test.ts
          src/lib/publishing/book-print-production.test.ts
          src/lib/publishing/book-os-quality-center-link.test.ts
          src/lib/publishing/book-os-launch-factory-link.test.ts
          src/lib/publishing/book-os-distribution-link.test.ts
          src/services/publishing/book-print-renderer.test.tsx
          src/lib/publishing/book-os-publication-package-ingest-migration-contract.test.ts
          src/lib/publishing/book-os-publication-assets-bucket-migration-contract.test.ts
          src/app/api/book-growth/package-ingest/route-contract.test.ts
          src/app/api/book-growth/distribution/focus/route-contract.test.ts
          src/app/api/publishing/book-engine/production-handoff/route-contract.test.ts
