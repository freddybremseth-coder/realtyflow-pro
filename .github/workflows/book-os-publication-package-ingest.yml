name: Book OS Publication Package Ingest

on:
  pull_request:
    paths:
      - "src/app/api/book-growth/package-ingest/**"
      - "src/app/api/book-growth/distribution/focus/**"
      - "src/app/api/publishing/book-engine/production-handoff/**"
      - "src/app/(content)/book-growth/layout.tsx"
      - "src/app/(content)/book-growth/production-handoff/**"
      - "src/app/(content)/book-growth/package-ingest/**"
      - "src/app/(content)/book-growth/quality-center/**"
      - "src/app/(content)/book-growth/launch-factory/**"
      - "src/app/(content)/book-growth/distribution/**"
      - "src/components/book-growth/quality-center-focus-context.tsx"
      - "src/components/book-growth/launch-factory-focus-context.tsx"
      - "src/components/book-growth/distribution-focus-context.tsx"
