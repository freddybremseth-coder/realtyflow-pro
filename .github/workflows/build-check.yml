name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        # GitHub's type-validation phase exceeds the package script's 4 GB heap.
        # Keep the larger heap local to CI so production/Vercel stays unchanged.
        run: node --max-old-space-size=5120 node_modules/next/dist/bin/next build
