name: CRM Action Priority

on:
  pull_request:
    paths:
      - "src/lib/customers/action-priority.ts"
      - "src/lib/customers/action-priority.test.ts"
      - ".github/workflows/crm-action-priority.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx src/lib/customers/action-priority.test.ts
