name: Customer Email Admission

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  customer-email-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Customer admission contracts
        run: npx tsx --test src/services/email/customer-mail-admission.contract.test.ts src/services/email/customer-mail-identity.test.ts src/services/email/history-backfill-worker.contract.test.ts
      - name: Inbound mail classification
        run: npx vitest run src/services/email/inbound-mail-filter.test.ts
