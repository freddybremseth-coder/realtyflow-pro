name: Email Suppression Safety

on:
  pull_request:
    paths:
      - "src/services/email/email-suppression.ts"
      - "src/services/email/email-suppression.contract.test.ts"
      - ".github/workflows/email-suppression-safety.yml"
  push:
    branches:
      - main
    paths:
      - "src/services/email/email-suppression.ts"
      - "src/services/email/email-suppression.contract.test.ts"
      - ".github/workflows/email-suppression-safety.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Verify suppression safety contract
        run: npx tsx --test src/services/email/email-suppression.contract.test.ts
