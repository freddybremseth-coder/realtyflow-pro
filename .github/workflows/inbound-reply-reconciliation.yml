name: Inbound Reply Reconciliation

on:
  pull_request:
    paths:
      - "src/app/api/cron/email-crm-sync/**"
      - "src/services/email/inbound-reply-reconciliation.ts"
      - "src/services/email/inbound-reply-reconciliation.test.ts"
      - ".github/workflows/inbound-reply-reconciliation.yml"
  push:
    branches:
      - main
    paths:
      - "src/app/api/cron/email-crm-sync/**"
      - "src/services/email/inbound-reply-reconciliation.ts"
      - "src/services/email/inbound-reply-reconciliation.test.ts"
      - ".github/workflows/inbound-reply-reconciliation.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Verify bounded reconciliation behavior
        run: npx tsx --test src/services/email/inbound-reply-reconciliation.test.ts src/app/api/cron/email-crm-sync/reconciliation.contract.test.ts
