name: Nexus Buyer Criteria

on:
  pull_request:
    paths:
      - "src/lib/nexus-inbox.ts"
      - "src/lib/nexus-inbox.test.ts"
      - "src/app/(content)/nexus-os/inbox/page.tsx"
      - "src/app/(content)/nexus-os/buyer-criteria-review/**"
      - "src/app/api/nexus/buyer-criteria-reviews/**"
      - ".github/workflows/nexus-buyer-criteria.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/nexus-inbox.ts"
      - "src/lib/nexus-inbox.test.ts"
      - "src/app/(content)/nexus-os/inbox/page.tsx"
      - "src/app/(content)/nexus-os/buyer-criteria-review/**"
      - "src/app/api/nexus/buyer-criteria-reviews/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Buyer criteria inbox tests
        run: npx tsx --test src/lib/nexus-inbox.test.ts src/app/api/nexus/buyer-criteria-reviews/route.contract.test.ts
