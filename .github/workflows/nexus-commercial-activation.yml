name: Nexus Commercial Activation

on:
  pull_request:
    paths:
      - "src/app/api/cron/nexus-commercial-activation/**"
      - "src/lib/nexus/buyer-profile-evidence.ts"
      - "src/lib/nexus/buyer-profile-evidence-draft.ts"
      - "src/services/lead-intelligence/server-runtime.ts"
      - "supabase/migrations/20260915071000_nexus_commercial_activation_runtime_boundary.sql"
      - ".github/workflows/nexus-commercial-activation.yml"
  push:
    branches:
      - main
    paths:
      - "src/app/api/cron/nexus-commercial-activation/**"
      - "src/lib/nexus/buyer-profile-evidence.ts"
      - "src/lib/nexus/buyer-profile-evidence-draft.ts"
      - "src/services/lead-intelligence/server-runtime.ts"
      - "supabase/migrations/20260915071000_nexus_commercial_activation_runtime_boundary.sql"
      - ".github/workflows/nexus-commercial-activation.yml"

jobs:
  safety-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Commercial activation safety tests
        run: >-
          npx tsx --test
          src/app/api/cron/nexus-commercial-activation/route.contract.test.ts
          src/lib/nexus/buyer-profile-evidence.test.ts
          src/lib/nexus/buyer-profile-evidence-draft.test.ts
          src/lib/nexus/buyer-profile-auto-activation.test.ts