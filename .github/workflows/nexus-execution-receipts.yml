name: Nexus Execution Receipts

on:
  pull_request:
    paths:
      - "src/lib/agentic/approval-gateway.ts"
      - "src/lib/agentic/approval-gateway.test.ts"
      - "src/lib/agentic/executor.ts"
      - "src/lib/agentic/executor.test.ts"
      - "src/services/agentic/receipt-identity.ts"
      - "src/services/agentic/approval-event-runtime.ts"
      - "src/services/agentic/executor-runtime.ts"
      - "src/services/agentic/execution-receipts.test.ts"
      - "src/lib/nexus/execution-throughput-health.ts"
      - "src/lib/nexus/execution-throughput-health.test.ts"
      - "src/app/api/nexus/outcome-measurement/route.ts"
      - "src/app/api/agentic/approvals/[id]/route.ts"
      - ".github/workflows/nexus-execution-receipts.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/agentic/approval-gateway.ts"
      - "src/lib/agentic/approval-gateway.test.ts"
      - "src/lib/agentic/executor.ts"
      - "src/lib/agentic/executor.test.ts"
      - "src/services/agentic/receipt-identity.ts"
      - "src/services/agentic/approval-event-runtime.ts"
      - "src/services/agentic/executor-runtime.ts"
      - "src/services/agentic/execution-receipts.test.ts"
      - "src/lib/nexus/execution-throughput-health.ts"
      - "src/lib/nexus/execution-throughput-health.test.ts"
      - "src/app/api/nexus/outcome-measurement/route.ts"
      - "src/app/api/agentic/approvals/[id]/route.ts"
      - ".github/workflows/nexus-execution-receipts.yml"

jobs:
  execution-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Execution receipt and throughput tests
        run: >-
          npx tsx --test
          src/lib/agentic/approval-gateway.test.ts
          src/lib/agentic/executor.test.ts
          src/services/agentic/execution-receipts.test.ts
          src/lib/nexus/execution-throughput-health.test.ts
          src/lib/nexus/outcome-measurement.test.ts
