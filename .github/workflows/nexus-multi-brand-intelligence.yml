name: Nexus Multi-brand Intelligence

on:
  pull_request:
    paths:
      - "src/lib/nexus/multi-brand-intelligence.ts"
      - "src/lib/nexus/multi-brand-intelligence.test.ts"
      - "src/app/api/nexus/multi-brand-intelligence/**"
      - "src/app/(content)/nexus-os/multi-brand-intelligence/**"
      - "src/app/(content)/nexus-os/layout.tsx"
      - ".github/workflows/nexus-multi-brand-intelligence.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/nexus/multi-brand-intelligence.ts"
      - "src/lib/nexus/multi-brand-intelligence.test.ts"
      - "src/app/api/nexus/multi-brand-intelligence/**"
      - "src/app/(content)/nexus-os/multi-brand-intelligence/**"
      - "src/app/(content)/nexus-os/layout.tsx"
      - ".github/workflows/nexus-multi-brand-intelligence.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Multi-brand isolation and aggregate intelligence tests
        run: npx tsx --test src/lib/nexus/multi-brand-intelligence.test.ts src/app/api/nexus/multi-brand-intelligence/route.contract.test.ts
