name: Nexus Revenue Brain

on:
  pull_request:
    paths:
      - "src/lib/nexus/revenue-brain.ts"
      - "src/lib/nexus/revenue-brain.test.ts"
      - "src/lib/nexus/action-policy-registry.ts"
      - "src/lib/nexus/action-policy-registry.test.ts"
      - "src/app/api/revenue/executive-briefing/route.ts"
      - "docs/nexus-ai-operating-system-roadmap.md"
      - "docs/nexus/NEXUS_ACTION_POLICY_REGISTRY_V1.md"
      - ".github/workflows/nexus-revenue-brain.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/nexus/revenue-brain.ts"
      - "src/lib/nexus/revenue-brain.test.ts"
      - "src/lib/nexus/action-policy-registry.ts"
      - "src/lib/nexus/action-policy-registry.test.ts"
      - "src/app/api/revenue/executive-briefing/route.ts"
      - "docs/nexus-ai-operating-system-roadmap.md"
      - "docs/nexus/NEXUS_ACTION_POLICY_REGISTRY_V1.md"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Revenue Brain and policy registry tests
        run: npx tsx --test src/lib/nexus/action-policy-registry.test.ts src/lib/nexus/revenue-brain.test.ts
