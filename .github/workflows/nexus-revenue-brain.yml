name: Nexus Revenue Brain

on:
  pull_request:
    paths:
      - "src/lib/nexus/revenue-brain.ts"
      - "src/lib/nexus/revenue-brain.test.ts"
      - "src/lib/nexus/action-policy-registry.ts"
      - "src/lib/nexus/action-policy-registry.test.ts"
      - "src/lib/nexus/outcome-measurement.ts"
      - "src/lib/nexus/outcome-measurement.test.ts"
      - "src/lib/nexus/revenue-learning.ts"
      - "src/lib/nexus/revenue-learning.test.ts"
      - "src/lib/nexus/communication-learning.ts"
      - "src/lib/nexus/communication-learning.test.ts"
      - "src/lib/nexus/communication-learning.contract.test.ts"
      - "src/lib/nexus/next-best-action-communication.ts"
      - "src/lib/nexus/next-best-action-communication.test.ts"
      - "src/app/api/revenue/executive-briefing/route.ts"
      - "src/app/api/nexus/next-best-action/route.ts"
      - "src/app/api/nexus/outcome-measurement/route.ts"
      - "src/app/api/nexus/communications/learning/route.ts"
      - "src/app/api/cron/nexus-outcome-snapshot/route.ts"
      - "src/app/api/cron/nexus-revenue-learning/route.ts"
      - "src/app/api/cron/communications-learning/route.ts"
      - "vercel.json"
      - "docs/nexus-ai-operating-system-roadmap.md"
      - "docs/nexus/NEXUS_ACTION_POLICY_REGISTRY_V1.md"
      - "docs/nexus/NEXUS_OUTCOME_MEASUREMENT_V1.md"
      - "docs/nexus/NEXUS_REVENUE_LEARNING_V1.md"
      - "docs/nexus/NEXUS_COMMUNICATION_LEARNING_V1.md"
      - "docs/nexus/NEXUS_NEXT_BEST_ACTION_V1.md"
      - ".github/workflows/nexus-revenue-brain.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/nexus/revenue-brain.ts"
      - "src/lib/nexus/revenue-brain.test.ts"
      - "src/lib/nexus/action-policy-registry.ts"
      - "src/lib/nexus/action-policy-registry.test.ts"
      - "src/lib/nexus/outcome-measurement.ts"
      - "src/lib/nexus/outcome-measurement.test.ts"
      - "src/lib/nexus/revenue-learning.ts"
      - "src/lib/nexus/revenue-learning.test.ts"
      - "src/lib/nexus/communication-learning.ts"
      - "src/lib/nexus/communication-learning.test.ts"
      - "src/lib/nexus/communication-learning.contract.test.ts"
      - "src/lib/nexus/next-best-action-communication.ts"
      - "src/lib/nexus/next-best-action-communication.test.ts"
      - "src/app/api/revenue/executive-briefing/route.ts"
      - "src/app/api/nexus/next-best-action/route.ts"
      - "src/app/api/nexus/outcome-measurement/route.ts"
      - "src/app/api/nexus/communications/learning/route.ts"
      - "src/app/api/cron/nexus-outcome-snapshot/route.ts"
      - "src/app/api/cron/nexus-revenue-learning/route.ts"
      - "src/app/api/cron/communications-learning/route.ts"
      - "vercel.json"
      - "docs/nexus-ai-operating-system-roadmap.md"
      - "docs/nexus/NEXUS_ACTION_POLICY_REGISTRY_V1.md"
      - "docs/nexus/NEXUS_OUTCOME_MEASUREMENT_V1.md"
      - "docs/nexus/NEXUS_REVENUE_LEARNING_V1.md"
      - "docs/nexus/NEXUS_COMMUNICATION_LEARNING_V1.md"
      - "docs/nexus/NEXUS_NEXT_BEST_ACTION_V1.md"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Revenue Brain, policy, outcome, revenue, communication and next-best-action learning tests
        run: npx tsx --test src/lib/nexus/action-policy-registry.test.ts src/lib/nexus/revenue-brain.test.ts src/lib/nexus/outcome-measurement.test.ts src/lib/nexus/revenue-learning.test.ts src/lib/nexus/communication-learning.test.ts src/lib/nexus/communication-learning.contract.test.ts src/lib/nexus/next-best-action-communication.test.ts
