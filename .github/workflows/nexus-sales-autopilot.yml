name: Nexus Sales Autopilot

on:
  pull_request:
    paths:
      - "src/app/api/cron/nexus-shortlist-prep/**"
      - "src/app/api/cron/nexus-property-match-prep/**"
      - "src/services/email/inbound-property-match.ts"
      - "vercel.json"
      - ".github/workflows/nexus-sales-autopilot.yml"
  push:
    branches:
      - main
    paths:
      - "src/app/api/cron/nexus-shortlist-prep/**"
      - "src/app/api/cron/nexus-property-match-prep/**"
      - "src/services/email/inbound-property-match.ts"
      - "vercel.json"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Nexus shortlist autopilot tests
        run: npx tsx --test src/app/api/cron/nexus-shortlist-prep/route.contract.test.ts src/services/email/inbound-buyer-profile-autopilot.test.ts
