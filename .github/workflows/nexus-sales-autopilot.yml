jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Nexus sales autopilot tests
        run: npx tsx --test src/app/api/cron/nexus-shortlist-prep/route.contract.test.ts src/app/api/cron/nexus-property-match-prep/route.contract.test.ts src/app/api/cron/nexus-presentation-prep/route.contract.test.ts src/app/api/cron/nexus-no-match-followup/route.contract.test.ts src/app/api/cron/nexus-send-preflight/route.contract.test.ts src/app/api/cron/nexus-property-recommendation-send/route.contract.test.ts src/app/api/cron/nexus-property-feedback/route.contract.test.ts src/app/api/nexus/shortlist-reviews/route.contract.test.ts src/app/api/nexus/no-match-reviews/route.contract.test.ts src/app/api/nexus/presentation-reviews/route.contract.test.ts src/app/api/nexus/pipeline-health/route.contract.test.ts src/lib/nexus/action-policy-registry.test.ts src/lib/nexus/execution-boundary.test.ts src/lib/nexus/execution-boundary.contract.test.ts src/lib/nexus/customer-taste-profile.test.ts src/lib/nexus/pipeline-health.test.ts src/lib/nexus-inbox.test.ts src/services/email/apply-inbound-crm-actions-governance.test.ts src/services/email/inbound-buyer-profile-autopilot.test.ts src/services/email/inbound-buyer-profile-revision.test.ts src/services/email/no-match-clarification.test.ts src/services/email/nexus-send-preflight.test.ts src/services/email/property-recommendation-template.test.ts src/services/email/property-recommendation-reply.test.ts src/services/lead-intelligence/presentation.test.ts src/services/marketing/autonomous-orchestrator.test.ts src/services/marketing/publish-executor.claim-guard.test.ts
