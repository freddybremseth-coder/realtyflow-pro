name: Nexus Task Execution Claim
on:
  pull_request:
    paths:
      - "src/lib/nexus/task-execution-claim.ts"
      - "src/lib/nexus/task-execution-claim.test.ts"
      - "docs/altovena-nexus-execution-claim.md"
      - ".github/workflows/nexus-task-execution-claim.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/nexus/task-execution-claim.ts"
      - "src/lib/nexus/task-execution-claim.test.ts"
      - ".github/workflows/nexus-task-execution-claim.yml"
permissions:
  contents: read
jobs:
  verify-nexus-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --silent
      - name: Validate Nexus claim boundaries
        run: node --import tsx --test src/lib/nexus/task-execution-claim.test.ts src/lib/nexus/execution-boundary.test.ts
