name: Re-Master long-form production safety

on:
  pull_request:
    paths:
      - "src/services/pipelines/remaster-mix-worker.ts"
      - "src/services/integrations/remaster-youtube-longform.ts"
      - "src/app/api/cron/remaster-playlist-recovery/route.ts"
      - "src/app/api/cron/remaster-youtube-public-reconcile/route.ts"
      - "src/lib/remaster-longform-production-safety.contract.test.ts"
      - "vercel.json"
      - ".github/workflows/remaster-longform-production-safety.yml"
  push:
    branches:
      - main
    paths:
      - "src/services/pipelines/remaster-mix-worker.ts"
      - "src/services/integrations/remaster-youtube-longform.ts"
      - "src/app/api/cron/remaster-playlist-recovery/route.ts"
      - "src/app/api/cron/remaster-youtube-public-reconcile/route.ts"
      - "src/lib/remaster-longform-production-safety.contract.test.ts"
      - "vercel.json"
      - ".github/workflows/remaster-longform-production-safety.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Re-Master long-form safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Test production safety contract
        run: node --import tsx --test src/lib/remaster-longform-production-safety.contract.test.ts
