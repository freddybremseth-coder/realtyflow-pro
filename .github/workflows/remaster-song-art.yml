name: Re-Master song art gallery safety
on:
  pull_request:
    paths:
      - ".github/workflows/remaster-song-art.yml"
      - "src/services/pipelines/remaster-song-art*"
      - "src/services/pipelines/neural-beat-pipeline.ts"
      - "src/services/integrations/thumbnail-composer.ts"
      - "src/services/integrations/ffmpeg-renderer.ts"
      - "src/app/api/public/remaster-art-gallery/**"
      - "src/middleware.ts"
permissions:
  contents: read
jobs:
  art-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent
      - run: npx tsx --test src/services/pipelines/remaster-song-art.test.ts
