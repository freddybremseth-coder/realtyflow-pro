name: CRM Sales Assistant

on:
  pull_request:
    paths:
      - "src/lib/customers/sales-assistant-note.ts"
      - "src/lib/customers/sales-assistant-note.test.ts"
      - "src/lib/calendar/google-followup.ts"
      - "src/app/api/customers/**/sales-assistant-note/**"
      - "src/components/customers/customer-sales-assistant-note.tsx"
      - "src/components/crm/crm-customer-card.tsx"
      - ".github/workflows/sales-assistant-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/customers/sales-assistant-note.ts"
      - "src/lib/calendar/google-followup.ts"
      - "src/app/api/customers/**/sales-assistant-note/**"
      - "src/components/customers/customer-sales-assistant-note.tsx"
      - "src/components/crm/crm-customer-card.tsx"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - name: Sales assistant policy and route tests
        run: NODE_OPTIONS=--conditions=react-server npx tsx --test src/lib/customers/sales-assistant-note.test.ts src/app/api/customers/[contactId]/sales-assistant-note/route.contract.test.ts
