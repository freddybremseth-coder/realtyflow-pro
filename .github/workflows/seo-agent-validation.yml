name: Sam SEO skill and audit tests

on:
  pull_request:
    paths:
      - 'src/services/agents/seo-*.ts'
      - 'src/components/hub/sam-seo-*.tsx'
      - 'src/middleware.ts'
      - 'src/middleware.test.ts'
      - 'src/app/api/agents/seo-*/**'
      - 'src/app/api/cron/seo-growth-review/**'
      - 'src/app/api/cron/seo-autopilot/**'
      - 'src/app/api/public/search-discovery/**'
      - 'src/app/api/public/conversion-event/**'
      - '.github/workflows/seo-agent-validation.yml'
  push:
    branches: [main]
    paths:
      - 'src/services/agents/seo-*.ts'
      - 'src/components/hub/sam-seo-*.tsx'
      - 'src/middleware.ts'
      - 'src/middleware.test.ts'
      - 'src/app/api/agents/seo-*/**'
      - 'src/app/api/cron/seo-growth-review/**'
      - 'src/app/api/cron/seo-autopilot/**'
      - 'src/app/api/public/search-discovery/**'
      - 'src/app/api/public/conversion-event/**'
      - '.github/workflows/seo-agent-validation.yml'

jobs:
  seo-skill-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check Sam SEO evidence and public audit contracts
        run: node --import tsx --test src/services/agents/seo-*.test.ts
      - name: Verify public discovery admission and private route boundaries
        run: NODE_OPTIONS=--conditions=react-server node --import tsx --test src/middleware.test.ts src/app/api/public/search-discovery/route.test.ts src/app/api/public/conversion-event/route.test.ts src/app/api/agents/seo-brand-publishing/route.test.ts
