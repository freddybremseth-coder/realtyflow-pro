name: Sam SEO skill and audit tests

on:
  pull_request:
    paths:
      - 'src/services/agents/seo-*.ts'
      - 'src/components/hub/sam-seo-action-board.tsx'
      - 'src/middleware.ts'
      - 'src/middleware.test.ts'
      - 'src/app/api/agents/seo-*/**'
      - 'src/app/api/cron/seo-growth-review/**'
      - 'src/app/api/cron/seo-autopilot/**'
      - 'src/app/api/public/search-discovery/**'
      - '.github/workflows/seo-agent-validation.yml'
  push:
    branches: [main]
    paths:
      - 'src/services/agents/seo-*.ts'
      - 'src/components/hub/sam-seo-action-board.tsx'
      - 'src/middleware.ts'
      - 'src/middleware.test.ts'
      - 'src/app/api/agents/seo-*/**'
      - 'src/app/api/cron/seo-growth-review/**'
      - 'src/app/api/cron/seo-autopilot/**'
      - 'src/app/api/public/search-discovery/**'
      - '.github/workflows/seo-agent-validation.yml'

jobs:
  seo-skill-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check Sam SEO evidence and public audit contracts
        run: node --import tsx --test src/services/agents/seo-page-quality.test.ts src/services/agents/seo-controls.test.ts src/services/agents/seo-audit.test.ts src/services/agents/seo-skills.test.ts src/services/agents/seo-site-strategy.test.ts src/services/agents/seo-leads.test.ts src/services/agents/seo-search-console.test.ts src/services/agents/seo-page-sampler.test.ts src/services/agents/seo-priorities.test.ts src/services/agents/seo-diagnostics.test.ts src/services/agents/seo-referral-health.test.ts src/services/agents/seo-github-capability.test.ts src/services/agents/seo-autopilot-policy.test.ts src/services/agents/seo-change-monitor.test.ts src/services/agents/seo-zeneco-metadata.test.ts src/services/agents/seo-zeneco-publisher.test.ts src/services/agents/seo-zeneco-metadata.test.ts src/services/agents/seo-referrer-classifier.test.ts src/services/agents/seo-discovery-storage.test.ts
      - name: Verify public discovery admission and private route boundaries
        run: NODE_OPTIONS=--conditions=react-server node --import tsx --test src/middleware.test.ts src/app/api/public/search-discovery/route.test.ts
