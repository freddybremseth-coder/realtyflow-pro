name: Sam SEO skill and audit tests

on:
  pull_request:
    paths:
      - 'src/services/agents/seo-*.ts'
      - 'src/app/api/agents/seo-*/**'
      - 'src/app/api/cron/seo-growth-review/**'
      - 'src/app/api/cron/seo-autopilot/**'
      - '.github/workflows/seo-agent-validation.yml'
  push:
    branches: [main]
    paths:
      - 'src/services/agents/seo-*.ts'
      - 'src/app/api/agents/seo-*/**'
      - 'src/app/api/cron/seo-growth-review/**'
      - 'src/app/api/cron/seo-autopilot/**'
      - '.github/workflows/seo-agent-validation.yml'

jobs:
  seo-skill-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check Sam SEO evidence and public audit contracts
        run: node --import tsx --test src/services/agents/seo-audit.test.ts src/services/agents/seo-skills.test.ts src/services/agents/seo-leads.test.ts src/services/agents/seo-search-console.test.ts src/services/agents/seo-page-sampler.test.ts src/services/agents/seo-priorities.test.ts src/services/agents/seo-autopilot-policy.test.ts src/services/agents/seo-change-monitor.test.ts src/services/agents/seo-zeneco-metadata.test.ts
